[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt"
description = "Backtest framework with methodology support"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "tqdm>=4.62.0",
    "pytest>=8.3.5"

[tool.setuptools.dynamic]
version = {file = "bt/__version__.py"}

[tool.setuptools.packages.find]
include = ["bt", "bt.*"]
.setuptools.packages.find]
include = ["bt", "bt.*"]
